<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>월스트리트 타이쿤 - 통합 관리자 패널</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
            --accent-blue: #0284c7;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --accent-yellow: #f59e0b;
        }
        * { box-sizing: border-box; font-family: 'Pretendard', sans-serif; margin: 0; padding: 0; }
        body { background: #0f172a; color: #f8fafc; padding: 20px; min-height: 100vh; }
        .admin-container { max-width: 1200px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
        .card { background: var(--card-bg); border-radius: 16px; border: 1px solid #334155; padding: 24px; }
        .form-group { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
        label { font-size: 13px; font-weight: 700; color: #94a3b8; }
        input, select { background: #0f172a; border: 1px solid #475569; color: white; padding: 10px 14px; border-radius: 8px; font-size: 14px; outline: none; }
        .btn { border: none; padding: 10px 18px; border-radius: 8px; font-size: 14px; font-weight: 800; color: white; cursor: pointer; }
        .btn-blue { background: var(--accent-blue); }
        .btn-green { background: var(--accent-green); }
        .btn-red { background: var(--accent-red); }
        .btn-purple { background: #8b5cf6; }
        .table-wrapper { overflow-x: auto; max-height: 400px; border-radius: 10px; border: 1px solid #334155; margin-top: 10px; }
        table { width: 100%; border-collapse: collapse; text-align: left; font-size: 13.5px; }
        th { background: #0f172a; color: #94a3b8; padding: 12px 14px; position: sticky; top: 0; }
        td { padding: 12px 14px; border-bottom: 1px solid #334155; }
    </style>
</head>
<body>

<div class="admin-container">
    <div class="card">
        <h2>👤 유저 자산 및 주식 관리 & 선물 패널</h2>
        <div class="form-group">
            <label>대상 유저 선택</label>
            <select id="user-select">
                <option value="">-- 유저를 선택하세요 --</option>
            </select>
        </div>
        <div class="form-group">
            <label>현금 예수금 (원)</label>
            <input type="number" id="edit-user-cash">
        </div>
        <button class="btn btn-blue" id="save-user-btn">유저 정보 저장</button>
    </div>

    <div class="card">
        <h3>📈 주식 목록 및 선물하기</h3>
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr><th>티커</th><th>종목명</th><th>현재가</th><th>선물하기</th></tr>
                </thead>
                <tbody id="stock-table-body">
                    <tr><td colspan="4" style="text-align:center;">로딩 중...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- 선물 모달 -->
<div id="gift-modal" style="display:none; position:fixed; top:0; left:0; width:100vw; height:100vh; background:rgba(0,0,0,0.8); z-index:9999; justify-content:center; align-items:center;">
    <div style="background:#1e293b; padding:25px; border-radius:16px; border:2px solid #38bdf8; width:350px; color:white;">
        <h3 id="gift-modal-title" style="margin-bottom:15px; color:#facc15;">🎁 주식 선물하기</h3>
        <div class="form-group">
            <label>받을 유저</label>
            <select id="gift-target-user"></select>
        </div>
        <div class="form-group">
            <label>수량</label>
            <input type="number" id="gift-quantity" value="1" min="1">
        </div>
        <div style="display:flex; gap:10px; margin-top:15px;">
            <button class="btn btn-green" style="flex:1;" id="send-gift-btn">보내기</button>
            <button class="btn btn-red" id="close-gift-btn">취소</button>
        </div>
    </div>
</div>

<script>
    const SUPABASE_URL = 'https://qgtsxrvwrjkdezwzgrwr.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFndHN4cnZ3cmprZGV6d3pncndyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI0NTExMTYsImV4cCI6MjEwODAyNzExNn0.lEKSx92rIIjd1MMw0Faa-EoUhjeueWfLrzev1Ww9HVA';
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let stockDataList = [];
    let userListData = [];
    let activeGiftTicker = null;

    window.addEventListener('DOMContentLoaded', () => {
        loadData();

        // 이벤트 리스너 안전하게 바인딩
        document.getElementById('user-select').addEventListener('change', onUserSelect);
        document.getElementById('save-user-btn').addEventListener('click', saveUserData);
        document.getElementById('send-gift-btn').addEventListener('click', executeGift);
        document.getElementById('close-gift-btn').addEventListener('click', () => {
            document.getElementById('gift-modal').style.display = 'none';
        });
    });

    async function loadData() {
        // 주식 로드
        const { data: stocks } = await db.from('stock_market').select('*').order('ticker');
        stockDataList = stocks || [];
        
        let stockHtml = '';
        stockDataList.forEach(s => {
            stockHtml += `
                <tr>
                    <td><b>${s.ticker}</b></td>
                    <td>${s.name}</td>
                    <td>${(s.price || 0).toLocaleString()}원</td>
                    <td><button class="btn btn-purple" onclick="openGift('${s.ticker}')">🎁 선물</button></td>
                </tr>
            `;
        });
        document.getElementById('stock-table-body').value = stockHtml; // wait, innerHTML
        document.getElementById('stock-table-body').innerHTML = stockHtml;

        // 유저 로드
        const { data: users } = await db.from('stock_rankings').select('*').order('name');
        userListData = users || [];

        const userSelect = document.getElementById('user-select');
        const giftSelect = document.getElementById('gift-target-user');
        userSelect.innerHTML = '<option value="">-- 유저 선택 --</option>';
        giftSelect.innerHTML = '';

        userListData.forEach(u => {
            userSelect.innerHTML += `<option value="${u.name}">${u.name} (자산: ${(u.coins || 0).toLocaleString()}원)</option>`;
            giftSelect.innerHTML += `<option value="${u.name}">${u.name}</option>`;
        });
    }

    window.openGift = function(ticker) {
        activeGiftTicker = ticker;
        document.getElementById('gift-modal-title').innerText = `🎁 [${ticker}] 선물하기`;
        document.getElementById('gift-modal').style.display = 'flex';
    };

    function onUserSelect() {
        const name = document.getElementById('user-select').value;
        const user = userListData.find(u => u.name === name);
        if (user) {
            document.getElementById('edit-user-cash').value = user.coins || 0;
        }
    }

    async function saveUserData() {
        const name = document.getElementById('user-select').value;
        const cash = parseInt(document.getElementById('edit-user-cash').value);
        if (!name) { alert('유저를 선택하세요!'); return; }

        const { error } = await db.from('stock_rankings').update({ coins: cash }).eq('name', name);
        if (error) alert('실패: ' + error.message);
        else { alert('자산 수정 완료!'); loadData(); }
    }

    async function executeGift() {
        const targetName = document.getElementById('gift-target-user').value;
        const qty = parseInt(document.getElementById('gift-quantity').value);

        alert(`전송 시도: ${targetName}에게 ${activeGiftTicker} ${qty}주`);

        const { data: targetUser, error } = await db.from('stock_rankings').select('*').eq('name', targetName).maybeSingle();
        if (error || !targetUser) {
            alert('유저 조회 실패: ' + (error ? error.message : '대상 없음'));
            return;
        }

        let port = targetUser.portfolio || {};
        if (typeof port === 'string') { try { port = JSON.parse(port); } catch(e) { port = {}; } }

        let cur = port[activeGiftTicker] ? (port[activeGiftTicker].shares || port[activeGiftTicker]) : 0;
        port[activeGiftTicker] = { shares: cur + qty, avgPrice: 1000 };

        const { error: updateErr } = await db.from('stock_rankings').update({ portfolio: port }).eq('name', targetName);

        if (updateErr) {
            alert('업데이트 에러: ' + updateErr.message);
        } else {
            alert('🎁 선물 성공!');
            document.getElementById('gift-modal').style.display = 'none';
            loadData();
        }
    }
</script>
</body>
</html>
