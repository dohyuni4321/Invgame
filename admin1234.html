<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>월스트리트 타이쿤 - 통합 관리자 패널</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --bg-dark: #0f172a; --card-bg: #1e293b; --accent-blue: #0284c7; --accent-green: #10b981; --accent-red: #ef4444; --accent-yellow: #f59e0b; }
        * { box-sizing: border-box; font-family: 'Pretendard', sans-serif; margin: 0; padding: 0; }
        body { background: var(--bg-dark); color: #f8fafc; padding: 20px; min-height: 100vh; }
        .admin-container { max-width: 1350px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
        .header { background: var(--card-bg); padding: 20px 30px; border-radius: 16px; border: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; }
        .header h1 { font-size: 24px; font-weight: 900; color: #38bdf8; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        @media (max-width: 950px) { .grid-2 { grid-template-columns: 1fr; } }
        .card { background: var(--card-bg); border-radius: 16px; border: 1px solid #334155; padding: 24px; }
        .card-title { font-size: 18px; font-weight: 800; margin-bottom: 16px; color: #facc15; display: flex; justify-content: space-between; align-items: center; }
        .form-group { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
        .form-row { display: flex; gap: 10px; flex-wrap: wrap; }
        .form-row .form-group { flex: 1; min-width: 140px; }
        label { font-size: 13px; font-weight: 700; color: #94a3b8; }
        input, select, textarea { background: #0f172a; border: 1px solid #475569; color: white; padding: 10px 14px; border-radius: 8px; font-size: 14px; outline: none; }
        input:focus, select:focus { border-color: #38bdf8; }
        .btn { border: none; padding: 10px 18px; border-radius: 8px; font-size: 14px; font-weight: 800; color: white; cursor: pointer; transition: 0.2s; }
        .btn-blue { background: var(--accent-blue); } .btn-green { background: var(--accent-green); } .btn-red { background: var(--accent-red); } .btn-yellow { background: var(--accent-yellow); color: #0f172a; } .btn-purple { background: #8b5cf6; }
        .user-stock-box { background: #0f172a; border: 1px solid #334155; border-radius: 10px; padding: 12px; margin-top: 10px; max-height: 200px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
        .user-stock-item { display: flex; justify-content: space-between; align-items: center; background: #1e293b; padding: 8px 12px; border-radius: 8px; border: 1px solid #475569; font-size: 13.5px; }
        .table-wrapper { overflow-x: auto; max-height: 400px; border-radius: 10px; border: 1px solid #334155; margin-top: 10px; }
        table { width: 100%; border-collapse: collapse; text-align: left; font-size: 13.5px; }
        th { background: #0f172a; color: #94a3b8; padding: 12px 14px; position: sticky; top: 0; z-index: 10; }
        td { padding: 12px 14px; border-bottom: 1px solid #334155; font-weight: 600; }
        .badge-ticker { background: #0f172a; color: #38bdf8; padding: 4px 8px; border-radius: 6px; border: 1px solid #0284c7; }
    </style>
</head>
<body>

<div class="admin-container">
    <div class="header">
        <h1>⚡ 월스트리트 타이쿤 - 통합 관리자 패널 (정규화 버전)</h1>
        <button class="btn btn-red" onclick="resetAllStockPrices()">💣 시세 전체 리셋</button>
    </div>

    <div class="grid-2">
        <!-- 종목 관리 -->
        <div class="card">
            <div class="card-title">➕ 주식 종목 등록 / 수정</div>
            <div class="form-row">
                <div class="form-group"><label>티커</label><input type="text" id="stock-ticker" placeholder="예: NVDA"></div>
                <div class="form-group"><label>종목명</label><input type="text" id="stock-name" placeholder="예: 엔비디아"></div>
            </div>
            <div class="form-row">
                <div class="form-group"><label>현재가 (원)</label><input type="number" id="stock-price" placeholder="120000"></div>
            </div>
            <button class="btn btn-green" style="width:100%; margin-top:10px;" onclick="upsertStock()">종목 저장 / 추가</button>
        </div>

        <!-- 유저 자산 관리 -->
        <div class="card">
            <div class="card-title">👤 유저 계정 및 보유 주식 직접 관리</div>
            <div class="form-group">
                <label>대상 유저 선택</label>
                <select id="user-select" onchange="onUserSelectChange()"><option value="">-- 유저 선택 --</option></select>
            </div>
            <div class="form-row">
                <div class="form-group"><label>유저 이름</label><input type="text" id="edit-user-name" readonly></div>
                <div class="form-group"><label>비밀번호</label><input type="text" id="edit-user-pwd"></div>
            </div>
            <div class="form-group"><label>현금 예수금 (원)</label><input type="number" id="edit-user-cash"></div>
            <div class="form-group">
                <label>💼 보유 주식 관리</label>
                <div class="user-stock-box" id="user-stock-list-ui"><span style="color:#94a3b8; font-size:13px;">유저를 선택하세요.</span></div>
            </div>
            <div style="display: flex; gap: 10px; margin-top: 14px;">
                <button class="btn btn-blue" style="flex:2;" onclick="saveUserData()">유저 정보 저장</button>
                <button class="btn btn-red" style="flex:1;" onclick="deleteUser()">계정 삭제</button>
            </div>
        </div>
    </div>

    <!-- 주식 목록 및 선물 -->
    <div class="card">
        <div class="card-title">
            <span>📈 주식 종목 현황 및 선물하기</span>
            <button class="btn btn-blue" style="font-size: 12px; padding: 6px 12px;" onclick="loadData()">새로고침</button>
        </div>
        <div class="table-wrapper">
            <table>
                <thead><tr><th>티커</th><th>종목명</th><th>현재가</th><th>선물하기</th><th>관리</th></tr></thead>
                <tbody id="stock-table-body"><tr><td colspan="5" style="text-align:center;">로딩 중...</td></tr></tbody>
            </table>
        </div>
    </div>
</div>

<!-- 선물 모달 -->
<div id="gift-modal" style="display:none; position:fixed; top:0; left:0; width:100vw; height:100vh; background:rgba(15,23,42,0.8); z-index:9999; justify-content:center; align-items:center;">
    <div style="background:#1e293b; padding:25px; border-radius:16px; border:2px solid #38bdf8; width:350px; color:white;">
        <h3 id="gift-modal-title" style="margin-bottom:15px; color:#facc15;">🎁 주식 선물하기</h3>
        <div class="form-group"><label>받을 유저</label><select id="gift-target-user"></select></div>
        <div class="form-group"><label>수량 (주)</label><input type="number" id="gift-quantity" value="1" min="1"></div>
        <div style="display:flex; gap:10px; margin-top:15px;">
            <button class="btn btn-green" style="flex:1;" onclick="executeGiftStock()">선물 보내기</button>
            <button class="btn btn-red" onclick="closeGiftModal()">취소</button>
        </div>
    </div>
</div>

<script>
    const SUPABASE_URL = 'https://qgtsxrvwrjkdezwzgrwr.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFndHN4cnZ3cmprZGV6d3pncndyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI0NTExMTYsImV4cCI6MjEwODAyNzExNn0.lEKSx92rIIjd1MMw0Faa-EoUhjeueWfLrzev1Ww9HVA';
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let stockDataList = [];
    let userListData = [];
    let selectedUserStocks = [];
    let giftTargetTicker = null;

    window.addEventListener('DOMContentLoaded', () => { loadData(); });

    async function loadData() {
        await loadStockTable();
        await loadUserList();
    }

    async function loadStockTable() {
        const { data } = await db.from('stock_market').select('*').order('ticker');
        stockDataList = data || [];
        let html = '';
        stockDataList.forEach(s => {
            html += `
                <tr>
                    <td><span class="badge-ticker">${s.ticker}</span></td>
                    <td><b>${s.name}</b></td>
                    <td style="color:#4ade80;">${(s.price || 0).toLocaleString()}원</td>
                    <td><button class="btn btn-purple" style="padding:6px 12px;" onclick="openGiftModal('${s.ticker}')">🎁 선물</button></td>
                    <td>
                        <button class="btn btn-yellow" style="padding:4px 8px; font-size:11px;" onclick="editStock('${s.ticker}')">수정</button>
                        <button class="btn btn-red" style="padding:4px 8px; font-size:11px;" onclick="deleteStock('${s.ticker}')">삭제</button>
                    </td>
                </tr>
            `;
        });
        document.getElementById('stock-table-body').innerHTML = html || '<tr><td colspan="5" style="text-align:center;">주식 없음</td></tr>';
    }

    async function loadUserList() {
        const { data } = await db.from('stock_rankings').select('*').order('name');
        userListData = data || [];
        const userSelect = document.getElementById('user-select');
        const giftSelect = document.getElementById('gift-target-user');
        userSelect.innerHTML = '<option value="">-- 유저 선택 --</option>';
        giftSelect.innerHTML = '';
        userListData.forEach(u => {
            userSelect.innerHTML += `<option value="${u.name}">${u.name} (현금: ${(u.coins || 0).toLocaleString()}원)</option>`;
            giftSelect.innerHTML += `<option value="${u.name}">${u.name}</option>`;
        });
    }

    async function onUserSelectChange() {
        const name = document.getElementById('user-select').value;
        const user = userListData.find(u => u.name === name);
        if (!user) {
            document.getElementById('edit-user-name').value = '';
            document.getElementById('edit-user-pwd').value = '';
            document.getElementById('edit-user-cash').value = '';
            selectedUserStocks = [];
            renderUserStockUI();
            return;
        }

        document.getElementById('edit-user-name').value = user.name;
        document.getElementById('edit-user-pwd').value = user.password || '';
        document.getElementById('edit-user-cash').value = user.coins || 0;

        // user_stocks 테이블에서 해당 유저의 보유 주식 가져오기
        const { data: stocks } = await db.from('user_stocks').select('*').eq('username', name);
        selectedUserStocks = stocks || [];
        renderUserStockUI();
    }

    function renderUserStockUI() {
        const box = document.getElementById('user-stock-list-ui');
        if (selectedUserStocks.length === 0) {
            box.innerHTML = '<span style="color:#94a3b8; font-size:13px;">보유 주식 없음</span>';
            return;
        }
        let html = '';
        selectedUserStocks.forEach(st => {
            html += `
                <div class="user-stock-item">
                    <span><b>${st.ticker}</b></span>
                    <div style="display:flex; gap:6px; align-items:center;">
                        <input type="number" value="${st.shares}" style="width:70px; padding:4px; text-align:center;" onchange="updateStockShare('${st.ticker}', this.value)">주
                        <button class="btn btn-red" style="padding:4px 8px; font-size:11px;" onclick="removeStockShare('${st.ticker}')">삭제</button>
                    </div>
                </div>
            `;
        });
        box.innerHTML = html;
    }

    function updateStockShare(ticker, val) {
        const shares = parseInt(val);
        const item = selectedUserStocks.find(s => s.ticker === ticker);
        if (item) {
            item.shares = isNaN(shares) ? 0 : shares;
        }
    }

    function removeStockShare(ticker) {
        selectedUserStocks = selectedUserStocks.filter(s => s.ticker !== ticker);
        renderUserStockUI();
    }

    async function saveUserData() {
        const name = document.getElementById('edit-user-name').value;
        const password = document.getElementById('edit-user-pwd').value.trim();
        const coins = parseInt(document.getElementById('edit-user-cash').value);
        if (!name) { alert('유저를 선택하세요.'); return; }

        // 1. 유저 기본 정보(비밀번호, 현금) 업데이트
        await db.from('stock_rankings').update({ password, coins }).eq('name', name);

        // 2. 보유 주식 목록 일괄 동기화 (upsert & delete)
        for (let st of selectedUserStocks) {
            if (st.shares > 0) {
                await db.from('user_stocks').upsert({
                    username: name,
                    ticker: st.ticker,
                    shares: st.shares,
                    avg_price: st.avg_price || 1000,
                    updated_at: new Date()
                }, { onConflict: 'username, ticker' });
            } else {
                await db.from('user_stocks').delete().eq('username', name).eq('ticker', st.ticker);
            }
        }
        alert('✅ 유저 정보가 성공적으로 저장되었습니다!');
        loadUserList();
    }

    async function deleteUser() {
        const name = document.getElementById('edit-user-name').value;
        if (!name || !confirm(`[${name}] 계정을 삭제하시겠습니까?`)) return;
        await db.from('stock_rankings').delete().eq('name', name);
        alert('계정이 삭제되었습니다.');
        loadUserList();
        onUserSelectChange();
    }

    function openGiftModal(ticker) {
        giftTargetTicker = ticker;
        document.getElementById('gift-modal-title').innerText = `🎁 [${ticker}] 주식 선물하기`;
        document.getElementById('gift-modal').style.display = 'flex';
    }

    function closeGiftModal() { document.getElementById('gift-modal').style.display = 'none'; }

    async function executeGiftStock() {
        const targetName = document.getElementById('gift-target-user').value;
        const qty = parseInt(document.getElementById('gift-quantity').value);
        if (!targetName || isNaN(qty) || qty <= 0) { alert('올바른 수량을 입력하세요.'); return; }

        // 기존 보유 수량 확인
        const { data: existing } = await db.from('user_stocks')
            .select('*')
            .eq('username', targetName)
            .eq('ticker', giftTargetTicker)
            .maybeSingle();

        const newShares = existing ? existing.shares + qty : qty;
        const curPrice = stockDataList.find(s => s.ticker === giftTargetTicker)?.price || 1000;

        const { error } = await db.from('user_stocks').upsert({
            username: targetName,
            ticker: giftTargetTicker,
            shares: newShares,
            avg_price: curPrice,
            updated_at: new Date()
        }, { onConflict: 'username, ticker' });

        if (error) {
            alert('선물 실패: ' + error.message);
        } else {
            alert(`🎁 [${targetName}]님에게 [${giftTargetTicker}] ${qty}주 선물이 완료되었습니다!`);
            closeGiftModal();
            loadUserList();
        }
    }

    async function upsertStock() {
        const ticker = document.getElementById('stock-ticker').value.trim().toUpperCase();
        const name = document.getElementById('stock-name').value.trim();
        const price = parseInt(document.getElementById('stock-price').value);
        if (!ticker || !name || isNaN(price)) { alert('필수 항목을 입력하세요.'); return; }

        await db.from('stock_market').upsert({ ticker, name, price, prev_price: price, updated_at: new Date() });
        alert(`종목 [${ticker}] 저장 완료.`);
        loadStockTable();
    }

    async function deleteStock(ticker) {
        if (!confirm(`[${ticker}] 종목을 삭제하시겠습니까?`)) return;
        await db.from('stock_market').delete().eq('ticker', ticker);
        loadStockTable();
    }

    function editStock(ticker) {
        const s = stockDataList.find(x => x.ticker === ticker);
        if (!s) return;
        document.getElementById('stock-ticker').value = s.ticker;
        document.getElementById('stock-name').value = s.name;
        document.getElementById('stock-price').value = s.price;
    }

    async function resetAllStockPrices() {
        if (!confirm('모든 주가 시세를 리셋하시겠습니까?')) return;
        alert('시세가 리셋되었습니다.');
        loadStockTable();
    }
</script>
</body>
</html>
