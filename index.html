<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>미국 주식 시뮬레이터 - 월스트리트 타이쿤</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --bg-color: #0f172a; --primary: #22c55e; --danger: #ef4444; }
        * { box-sizing: border-box; font-family: 'Pretendard', sans-serif; margin: 0; padding: 0; user-select: none; }
        body { background: #1e293b; color: #0f172a; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .container { width: 96vw; max-width: 1250px; background: #fff; border-radius: 24px; box-shadow: 0 20px 50px rgba(0,0,0,0.4); overflow: hidden; display: flex; flex-direction: column; }
        .top-user-bar { background: #0f172a; color: white; padding: 20px 30px; display: flex; gap: 10px; align-items: center; justify-content: center; flex-wrap: wrap; border-bottom: 3px solid #334155; }
        .top-user-bar input, .top-user-bar select { padding: 10px 12px; border-radius: 10px; border: 2px solid #475569; background: #1e293b; color: white; font-size: 14px; font-weight: bold; text-align: center; }
        .top-user-bar input[type="text"] { width: 130px; }
        .top-user-bar input[type="number"] { width: 70px; }
        .btn-challenge { background: #f97316; color: white; border: none; padding: 10px 25px; font-weight: 800; border-radius: 10px; font-size: 16px; cursor: pointer; }
        .dashboard { padding: 30px; background: #f8fafc; min-height: 480px; }
        .dash-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 15px; }
        .dash-title { font-size: 24px; font-weight: 900; color: #0f172a; }
        .global-asset-card { background: linear-gradient(135deg, #0284c7, #1e3a8a); color: white; border-radius: 16px; padding: 18px 25px; font-weight: 800; font-size: 16px; display: flex; align-items: center; gap: 15px; }
        .top-rank-card { background: linear-gradient(135deg, #0f172a, #1e293b); color: white; border-radius: 18px; padding: 25px 35px; display: flex; justify-content: space-between; align-items: center; border: 3px solid #f59e0b; margin-bottom: 20px; }
        .top-player-name { font-size: 28px; font-weight: 900; color: #ffffff; }
        .top-player-score { font-size: 32px; font-weight: 900; color: #facc15; }
        .rank-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; max-height: 280px; overflow-y: auto; }
        .rank-item { background: white; border: 2px solid #e2e8f0; padding: 14px 20px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; font-size: 16px; font-weight: 700; }
        .rank-num { width: 30px; color: #64748b; font-weight: 900; font-size: 18px; }
        .rank-score { color: #16a34a; font-weight: 800; }
        .bottom-nav-bar { background: #f1f5f9; border-top: 2px solid #e2e8f0; padding: 20px 30px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; }
        .main-title { font-size: 26px; font-weight: 900; color: #2563eb; }
        .nav-buttons { display: flex; gap: 10px; flex-wrap: wrap; }
        .nav-btn { border: none; padding: 12px 20px; border-radius: 10px; font-size: 15px; font-weight: 800; color: white; cursor: pointer; }
        .btn-yellow { background: #f59e0b; } .btn-green { background: #10b981; } .btn-blue { background: #0284c7; } .btn-purple { background: #8b5cf6; }
        #game-screen { display: none; padding: 30px; color: white; background: #0f172a; min-height: 600px; }
        .game-hud { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
        .hud-item { font-size: 17px; font-weight: 900; background: rgba(0,0,0,0.6); padding: 10px 16px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.2); }
        .btn-quit { background: var(--danger); color: white; border: none; padding: 8px 16px; font-weight: bold; border-radius: 8px; cursor: pointer; }
        .news-ticker-bar { background: #1e1b4b; border: 1px solid #4338ca; border-radius: 12px; padding: 12px 20px; margin-bottom: 20px; font-size: 14px; font-weight: 700; color: #c7d2fe; }
        .stock-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 15px; max-height: 420px; overflow-y: auto; padding-right: 5px; }
        .stock-card { background: rgba(30, 41, 59, 0.85); border: 2px solid #475569; border-radius: 14px; padding: 18px; display: flex; flex-direction: column; justify-content: space-between; cursor: pointer; }
        .stock-name { font-size: 16px; font-weight: 900; color: #f8fafc; }
        .stock-ticker { font-size: 12px; color: #94a3b8; background: #0f172a; padding: 2px 6px; border-radius: 4px; }
        .stock-price { font-size: 20px; font-weight: 900; margin-bottom: 4px; }
        .price-up { color: #22c55e; } .price-down { color: #ef4444; }
        .stock-actions { display: flex; gap: 6px; align-items: center; margin-top: 6px; }
        .stock-input { width: 55px; padding: 6px; background: #0f172a; border: 1px solid #475569; color: white; border-radius: 6px; text-align: center; font-weight: bold; }
        .btn-trade { padding: 6px 12px; font-weight: bold; border-radius: 6px; border: none; cursor: pointer; }
        .btn-buy { background: #22c55e; color: white; } .btn-sell { background: #ef4444; color: white; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(15, 23, 42, 0.8); justify-content: center; align-items: center; z-index: 9999; padding: 20px; }
        .modal-content { background: #ffffff; border-radius: 20px; padding: 28px; width: 100%; max-width: 620px; text-align: center; position: relative; max-height: 80vh; overflow-y: auto; color: #0f172a; }
        .modal-close { position: absolute; top: 18px; right: 20px; font-size: 22px; cursor: pointer; border: none; background: none; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <div class="top-user-bar" id="top-user-bar">
        <input type="text" id="school-input" placeholder="학교 이름" value="서울잠신초등학교">
        <select id="grade-select">
            <option value="6학년" selected>6학년</option>
        </select>
        <input type="number" id="class-input" min="1" max="30" placeholder="반" value="1"> <span>반</span>
        <input type="text" id="nickname-input" placeholder="닉네임" maxlength="6">
        <button class="btn-challenge" onclick="verifyAndStartGame()">트레이딩 시작</button>
    </div>

    <div id="main-dashboard" class="dashboard">
        <div class="dash-header">
            <div class="dash-title">📈 글로벌 주식 부자 랭킹</div>
            <div class="global-asset-card">
                <span>🌐</span>
                <div>
                    <div style="font-size: 13px; color: #bae6fd;">총 투자 자산 규모</div>
                    <div id="global-total-asset" style="color: #ffffff; font-size: 17px; font-weight: 900;">로딩 중...</div>
                </div>
            </div>
        </div>
        <div class="top-rank-card">
            <div>
                <div style="font-size:14px; color:#94a3b8; font-weight:800;">현재 1위 자산가</div>
                <div class="top-player-name" id="top1-name">불러오는 중...</div>
            </div>
            <div class="top-player-score" id="top1-score">0 원</div>
        </div>
        <div class="rank-grid" id="rank-list"></div>
    </div>

    <div id="game-screen">
        <div class="game-hud">
            <div class="hud-item">👤 <span id="hud-username" style="color:#facc15;">-</span></div>
            <div class="hud-item">💵 예수금: <span id="hud-cash" style="color:#4ade80;">1,000,000</span> 원</div>
            <div class="hud-item">💼 총자산: <span id="hud-total-asset" style="color:#38bdf8;">1,000,000</span> 원</div>
            <button class="btn-quit" onclick="quitGame()">거래 종료 & 저장</button>
        </div>
        <div class="news-ticker-bar" id="watchlist-news-ticker">📢 실시간 시장 정상 운영 중</div>
        <div style="font-size: 15px; font-weight: bold; margin-bottom: 12px; color: #94a3b8;">⚡ 실시간 서버 연동 주식 시장</div>
        <div class="stock-grid" id="stock-market-grid"></div>
    </div>

    <div class="bottom-nav-bar" id="bottom-bar">
        <div class="main-title">📈 월스트리트 주식 타이쿤</div>
        <div class="nav-buttons">
            <button class="nav-btn btn-green" onclick="openModal('news-modal')">📰 뉴스판</button>
            <button class="nav-btn btn-blue" onclick="openModal('portfolio-modal')">내 포트폴리오</button>
        </div>
    </div>
</div>

<!-- 뉴스판 모달 -->
<div id="news-modal" class="modal">
    <div class="modal-content">
        <button class="modal-close" onclick="closeModal('news-modal')">✖</button>
        <h2>📰 증권 실시간 뉴스판</h2>
        <div id="news-container" style="margin-top: 15px; text-align: left;"></div>
    </div>
</div>

<!-- 포트폴리오 모달 -->
<div id="portfolio-modal" class="modal">
    <div class="modal-content">
        <button class="modal-close" onclick="closeModal('portfolio-modal')">✖</button>
        <h2>💼 내 보유 주식 현황</h2>
        <div id="portfolio-list" style="margin-top: 15px; text-align: left;">보유 주식 없음</div>
    </div>
</div>

<script>
    // ⚠️ 새로운 Supabase 프로젝트의 URL과 Anon Key를 여기에 입력하세요!
const SUPABASE_URL = 'https://qgtsxrvwrjkdezwzgrwr.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFndHN4cnZ3cmprZGV6d3pncndyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI0NTExMTYsImV4cCI6MjEwODAyNzExNn0.lEKSx92rIIjd1MMw0Faa-EoUhjeueWfLrzev1Ww9HVA';
const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const EXCHANGE_RATE = 1350;
    let gameState = { currentUser: null, stocksList: [], marketPrices: {}, previousPrices: {}, stockNews: {}, isPlaying: false };

    window.addEventListener('DOMContentLoaded', async () => {
        await fetchServerStockMarket();
        fetchLeaderboard();
        setInterval(async () => {
            await fetchServerStockMarket();
            fetchLeaderboard();
        }, 3000);
    });

    async function fetchServerStockMarket() {
        try {
            const { data } = await db.from('stock_market').select('*').order('ticker');
            if (data && data.length > 0) {
                gameState.stocksList = data;
                data.forEach(s => {
                    gameState.previousPrices[s.ticker] = s.prev_price || s.price;
                    gameState.marketPrices[s.ticker] = s.price;
                    gameState.stockNews[s.ticker] = s.news || '정상 거래 진행 중';
                });
                renderStockMarket();
                if (gameState.isPlaying) {
                    updateHUD();
                    syncUserTotalAssetToServer();
                }
            }
        } catch (err) { console.error(err); }
    }

    async function fetchLeaderboard() {
        try {
            const { data } = await db.from('stock_rankings').select('name, coins').order('coins', { ascending: false });
            if (data && data.length > 0) {
                document.getElementById('top1-name').innerText = data[0].name;
                document.getElementById('top1-score').innerText = `${data[0].coins.toLocaleString()} 원`;
                let listHtml = '';
                for (let i = 1; i < Math.min(data.length, 10); i++) {
                    listHtml += `<div class="rank-item"><span class="rank-num">${i + 1}</span><span>${data[i].name}</span><span class="rank-score">${data[i].coins.toLocaleString()} 원</span></div>`;
                }
                document.getElementById('rank-list').innerHTML = listHtml;
                const totalAssetSum = data.reduce((sum, row) => sum + (row.coins || 0), 0);
                document.getElementById('global-total-asset').innerText = `${totalAssetSum.toLocaleString()} 원`;
            }
        } catch (err) { console.error(err); }
    }

    async function verifyAndStartGame() {
        const school = document.getElementById('school-input').value.trim();
        const grade = document.getElementById('grade-select').value;
        const cls = document.getElementById('class-input').value.trim();
        const nick = document.getElementById('nickname-input').value.trim();
        if (!school || !cls || !nick) { alert('정보를 모두 입력해주세요!'); return; }

        const fullName = `${school} ${grade} ${cls}반 ${nick}`;
        const { data } = await db.from('stock_rankings').select('*').eq('name', fullName).maybeSingle();

        let userCash = 1000000;
        let userPortfolio = {};

        if (data) {
            const pwd = prompt('비밀번호를 입력하세요:');
            if (pwd !== data.password) { alert('비밀번호 불일치'); return; }
            userPortfolio = data.portfolio || {};
            let stockVal = 0;
            for (let t in userPortfolio) stockVal += userPortfolio[t] * (gameState.marketPrices[t] || 1000);
            userCash = Math.max(0, data.coins - stockVal);
        } else {
            const pwd = prompt('신규 비밀번호 설정:');
            if (!pwd) return;
            await db.from('stock_rankings').insert({ name: fullName, coins: 1000000, password: pwd, portfolio: {} });
        }

        gameState.currentUser = { name: fullName, cash: userCash, portfolio: userPortfolio };
        startGameSession();
    }

    function startGameSession() {
        gameState.isPlaying = true;
        document.getElementById('top-user-bar').style.display = 'none';
        document.getElementById('main-dashboard').style.display = 'none';
        document.getElementById('bottom-bar').style.display = 'none';
        document.getElementById('game-screen').style.display = 'block';
        document.getElementById('hud-username').innerText = gameState.currentUser.name;
        renderStockMarket();
        updateHUD();
    }

    function renderStockMarket() {
        const grid = document.getElementById('stock-market-grid');
        let html = '';
        gameState.stocksList.forEach(stock => {
            const price = gameState.marketPrices[stock.ticker] || 1000;
            const prev = gameState.previousPrices[stock.ticker] || price;
            const diff = price - prev;
            const isUp = diff >= 0;
            const myShares = gameState.currentUser?.portfolio[stock.ticker] || 0;

            html += `
                <div class="stock-card">
                    <div>
                        <div style="display:flex; justify-content:space-between; margin-bottom:6px;">
                            <span class="stock-name">${stock.name}</span>
                            <span class="stock-ticker">${stock.ticker}</span>
                        </div>
                        <div class="stock-price ${isUp ? 'price-up' : 'price-down'}">${price.toLocaleString()} 원</div>
                        <div style="font-size:12px; color:#94a3b8; margin-bottom:6px;">보유: <b>${myShares}주</b></div>
                    </div>
                    <div class="stock-actions" onclick="event.stopPropagation()">
                        <input type="number" id="input-${stock.ticker}" class="stock-input" value="1" min="1">
                        <button class="btn-trade btn-buy" onclick="buyStock('${stock.ticker}')">매수</button>
                        <button class="btn-trade btn-sell" onclick="sellStock('${stock.ticker}')">매도</button>
                    </div>
                </div>
            `;
        });
        grid.innerHTML = html;
    }

    async function buyStock(ticker) {
        if (!gameState.currentUser) return;
        const qty = parseInt(document.getElementById(`input-${ticker}`).value) || 1;
        const price = gameState.marketPrices[ticker];
        const cost = price * qty;
        if (gameState.currentUser.cash < cost) { alert('현금 부족'); return; }

        gameState.currentUser.cash -= cost;
        gameState.currentUser.portfolio[ticker] = (gameState.currentUser.portfolio[ticker] || 0) + qty;
        await syncUserTotalAssetToServer();
        updateHUD();
        renderStockMarket();
    }

    async function sellStock(ticker) {
        if (!gameState.currentUser) return;
        const qty = parseInt(document.getElementById(`input-${ticker}`).value) || 1;
        const shares = gameState.currentUser.portfolio[ticker] || 0;
        if (shares < qty) { alert('보유 주식 부족'); return; }

        const price = gameState.marketPrices[ticker];
        gameState.currentUser.cash += price * qty;
        gameState.currentUser.portfolio[ticker] -= qty;
        if (gameState.currentUser.portfolio[ticker] === 0) delete gameState.currentUser.portfolio[ticker];
        await syncUserTotalAssetToServer();
        updateHUD();
        renderStockMarket();
    }

    function calculateTotalAsset() {
        if (!gameState.currentUser) return 0;
        let stockVal = 0;
        for (let t in gameState.currentUser.portfolio) stockVal += gameState.currentUser.portfolio[t] * (gameState.marketPrices[t] || 0);
        return gameState.currentUser.cash + stockVal;
    }

    async function syncUserTotalAssetToServer() {
        if (!gameState.currentUser) return;
        await db.from('stock_rankings').update({ coins: calculateTotalAsset(), portfolio: gameState.currentUser.portfolio }).eq('name', gameState.currentUser.name);
    }

    function updateHUD() {
        document.getElementById('hud-cash').innerText = gameState.currentUser.cash.toLocaleString();
        document.getElementById('hud-total-asset').innerText = calculateTotalAsset().toLocaleString();
    }

    function quitGame() {
        if (!confirm('거래를 종료하시겠습니까?')) return;
        gameState.isPlaying = false;
        syncUserTotalAssetToServer();
        location.reload();
    }

    function openModal(id) { document.getElementById(id).style.display = 'flex'; }
    function closeModal(id) { document.getElementById(id).style.display = 'none'; }
</script>
</body>
</html>
