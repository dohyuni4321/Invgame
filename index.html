<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>월스트리트 타이쿤 - 주식 시뮬레이터</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --bg-dark: #0f172a; --card-bg: #1e293b; --accent-blue: #0284c7; --accent-green: #10b981; --accent-red: #ef4444; --accent-yellow: #f59e0b; }
        * { box-sizing: border-box; font-family: 'Pretendard', sans-serif; margin: 0; padding: 0; }
        body { background: var(--bg-dark); color: #f8fafc; padding: 20px; min-height: 100vh; }
        .game-container { max-width: 1200px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
        .header { background: var(--card-bg); padding: 20px 30px; border-radius: 16px; border: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; }
        .header h1 { font-size: 22px; font-weight: 900; color: #38bdf8; }
        .card { background: var(--card-bg); border-radius: 16px; border: 1px solid #334155; padding: 24px; }
        .grid-2 { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; }
        @media (max-width: 900px) { .grid-2 { grid-template-columns: 1fr; } }
        .btn { border: none; padding: 10px 16px; border-radius: 8px; font-size: 14px; font-weight: 800; color: white; cursor: pointer; transition: 0.2s; }
        .btn-blue { background: var(--accent-blue); } .btn-green { background: var(--accent-green); } .btn-red { background: var(--accent-red); }
        .table-wrapper { overflow-x: auto; max-height: 450px; border-radius: 10px; border: 1px solid #334155; margin-top: 10px; }
        table { width: 100%; border-collapse: collapse; text-align: left; font-size: 14px; }
        th { background: #0f172a; color: #94a3b8; padding: 12px; position: sticky; top: 0; }
        td { padding: 12px; border-bottom: 1px solid #334155; }
        input, select { background: #0f172a; border: 1px solid #475569; color: white; padding: 10px; border-radius: 8px; width: 100%; outline: none; margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="game-container">
    <div class="header">
        <h1>📈 월스트리트 타이쿤</h1>
        <div id="user-info-box">
            <span id="display-username" style="font-weight: bold; color: #facc15;">로그인 필요</span>
            <span id="display-coins" style="margin-left: 15px; color: #4ade80;">0원</span>
            <button class="btn btn-red" style="margin-left: 15px; padding: 6px 12px; font-size: 12px;" onclick="logout()">로그아웃</button>
        </div>
    </div>

    <!-- 로그인 박스 -->
    <div id="login-card" class="card" style="max-width: 400px; margin: 50px auto; width: 100%;">
        <h2 style="margin-bottom: 15px; color: #facc15;">🔑 로그인 / 회원가입</h2>
        <div class="form-group">
            <label>유저 이름</label>
            <input type="text" id="login-name" placeholder="닉네임 입력">
        </div>
        <div class="form-group">
            <label>비밀번호</label>
            <input type="password" id="login-pwd" placeholder="비밀번호 입력">
        </div>
        <button class="btn btn-blue" style="width:100%; margin-top:10px;" onclick="loginUser()">입장하기</button>
    </div>

    <!-- 메인 거래소 화면 (로그인 시 표시) -->
    <div id="game-main" class="grid-2" style="display: none;">
        <div class="card">
            <h3>📊 실시간 주식 시장</h3>
            <div class="table-wrapper">
                <table>
                    <thead><tr><th>티커</th><th>종목명</th><th>현재가</th><th>뉴스</th><th>매매</th></tr></thead>
                    <tbody id="market-table-body"><tr><td colspan="5" style="text-align:center;">로딩 중...</td></tr></tbody>
                </table>
            </div>
        </div>

        <div class="card">
            <h3>💼 내 포트폴리오</h3>
            <div id="portfolio-box" style="margin-top: 15px; display: flex; flex-direction: column; gap: 10px; max-height: 400px; overflow-y: auto;">
                <span style="color: #94a3b8; font-size: 13px;">보유 주식이 없습니다.</span>
            </div>
        </div>
    </div>
</div>

<script>
    const SUPABASE_URL = 'https://qgtsxrvwrjkdezwzgrwr.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFndHN4cnZ3cmprZGV6d3pncndyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI0NTExMTYsImV4cCI6MjEwODAyNzExNn0.lEKSx92rIIjd1MMw0Faa-EoUhjeueWfLrzev1Ww9HVA';
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let currentUser = null;
    let stockList = [];
    let myStocks = [];

    async function loginUser() {
        const name = document.getElementById('login-name').value.trim();
        const password = document.getElementById('login-pwd').value.trim();
        if (!name) { alert('닉네임을 입력하세요.'); return; }

        let { data: user } = await db.from('stock_rankings').select('*').eq('name', name).maybeSingle();

        if (!user) {
            // 신규 회원가입
            const { data: newU, error } = await db.from('stock_rankings').insert([{ name, password, coins: 1000000 }]).select().single();
            if (error) { alert('가입 실패: ' + error.message); return; }
            user = newU;
            alert('🎉 회원가입을 축하합니다! 1,000,000원이 지급되었습니다.');
        } else {
            if (user.password && user.password !== password) {
                alert('비밀번호가 일치하지 않습니다.');
                return;
            }
        }

        currentUser = user;
        document.getElementById('login-card').style.display = 'none';
        document.getElementById('game-main').style.display = 'grid';
        document.getElementById('display-username').innerText = currentUser.name;
        
        await refreshGameData();
        setInterval(refreshGameData, 5000); // 5초마다 자동 갱신
    }

    function logout() {
        currentUser = null;
        document.getElementById('login-card').style.display = 'block';
        document.getElementById('game-main').style.display = 'none';
    }

    async function refreshGameData() {
        if (!currentUser) return;

        // 최신 유저 정보(현금) 로드
        const { data: uData } = await db.from('stock_rankings').select('*').eq('name', currentUser.name).single();
        if (uData) currentUser = uData;
        document.getElementById('display-coins').innerText = (currentUser.coins || 0).toLocaleString() + '원';

        // 시장 주가 로드
        const { data: sData } = await db.from('stock_market').select('*').order('ticker');
        stockList = sData || [];

        let mHtml = '';
        stockList.forEach(s => {
            mHtml += `
                <tr>
                    <td><b>${s.ticker}</b></td>
                    <td>${s.name}</td>
                    <td style="color:#4ade80;">${s.price.toLocaleString()}원</td>
                    <td style="font-size:12px; color:#cbd5e1;">${s.news || '-'}</td>
                    <td>
                        <button class="btn btn-green" style="padding:4px 8px; font-size:12px;" onclick="buyStock('${s.ticker}', ${s.price})">매수</button>
                    </td>
                </tr>
            `;
        });
        document.getElementById('market-table-body').innerHTML = mHtml;

        // 내 보유 주식 로드
        const { data: myData } = await db.from('user_stocks').select('*').eq('username', currentUser.name);
        myStocks = myData || [];

        let pHtml = '';
        if (myStocks.length === 0) {
            pHtml = '<span style="color: #94a3b8; font-size: 13px;">보유 주식이 없습니다.</span>';
        } else {
            myStocks.forEach(st => {
                const sObj = stockList.find(x => x.ticker === st.ticker);
                const curPrice = sObj ? sObj.price : st.avg_price;
                pHtml += `
                    <div style="background:#0f172a; padding:12px; border-radius:8px; border:1px solid #475569; display:flex; justify-content:space-between; align-items:center;">
                        <div>
                            <b>${st.ticker}</b> (${st.shares}주)<br>
                            <span style="font-size:12px; color:#94a3b8;">평단가: ${st.avg_price.toLocaleString()}원</span>
                        </div>
                        <button class="btn btn-red" style="padding:6px 12px; font-size:12px;" onclick="sellStock('${st.ticker}', ${curPrice})">매도</button>
                    </div>
                `;
            });
        }
        document.getElementById('portfolio-box').innerHTML = pHtml;
    }

    async function buyStock(ticker, price) {
        const qty = parseInt(prompt(`[${ticker}] 몇 주를 매수하시겠습니까?`, "1"));
        if (isNaN(qty) || qty <= 0) return;

        const totalCost = price * qty;
        if (currentUser.coins < totalCost) {
            alert('현금(예수금)이 부족합니다!');
            return;
        }

        // 1. 현금 차감
        const newCoins = currentUser.coins - totalCost;
        await db.from('stock_rankings').update({ coins: newCoins }).eq('name', currentUser.name);

        // 2. 보유 주식 추가/갱신
        const existing = myStocks.find(s => s.ticker === ticker);
        const newShares = existing ? existing.shares + qty : qty;
        
        await db.from('user_stocks').upsert({
            username: currentUser.name,
            ticker: ticker,
            shares: newShares,
            avg_price: price,
            updated_at: new Date()
        }, { onConflict: 'username, ticker' });

        alert(`🛒 [${ticker}] ${qty}주 매수 완료!`);
        refreshGameData();
    }

    async function sellStock(ticker, price) {
        const item = myStocks.find(s => s.ticker === ticker);
        if (!item) return;

        const qty = parseInt(prompt(`[${ticker}] 몇 주를 매도하시겠습니까? (보유: ${item.shares}주)`, "1"));
        if (isNaN(qty) || qty <= 0 || qty > item.shares) { alert('올바른 수량을 입력하세요.'); return; }

        const totalEarn = price * qty;
        const newCoins = currentUser.coins + totalEarn;

        // 1. 현금 증가
        await db.from('stock_rankings').update({ coins: newCoins }).eq('name', currentUser.name);

        // 2. 보유 주식 감소 또는 삭제
        const remainingShares = item.shares - qty;
        if (remainingShares > 0) {
            await db.from('user_stocks').update({ shares: remainingShares }).eq('username', currentUser.name).eq('ticker', ticker);
        } else {
            await db.from('user_stocks').delete().eq('username', currentUser.name).eq('ticker', ticker);
        }

        alert(`💰 [${ticker}] ${qty}주 매도 완료! (+${totalEarn.toLocaleString()}원)`);
        refreshGameData();
    }
</script>
</body>
</html>
